services:
  - type: web
    name: plantpal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --chdir backend wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: DEBUG
        value: "false"
      - key: USE_LOCAL_MODEL
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: PLANT_ID_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
